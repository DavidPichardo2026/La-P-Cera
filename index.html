<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La P-cera · David Pichardo</title>
  <meta name="description" content="Muestra poética de David Pichardo. Palabras como agua.">
  <meta property="og:title" content="La P-cera · David Pichardo">
  <meta property="og:description" content="Poesía de David Pichardo. Palabras como agua, como raíz, como marea.">
  <meta property="og:type" content="website">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ── Fondo animado ── -->
<div id="ocean-bg">
  <div class="layer layer-1"></div>
  <div class="layer layer-2"></div>
</div>

<div id="app">

  <!-- ── Header ── -->
  <header>
    <h1 class="site-title">La P-cera</h1>
    <p class="site-tagline">Muestra poética · David Pichardo</p>

    <!-- Koi GIF animado -->
    <div class="koi-wrapper" aria-hidden="true">
      <img class="koi" src="assets/koi.gif" alt="pez koi" />
    </div>

    <nav>
      <a href="#sobre-el-autor">El autor</a>
      <a href="#poemas">Poemas</a>
    </nav>
  </header>

  <!-- ── Sobre el autor ── -->
  <section id="sobre-el-autor" aria-label="Sobre el autor">
    <div id="author-img" class="author-photo-placeholder">🌊</div>
    <div>
      <h2 id="author-name" class="author-name">David Pichardo</h2>
      <p  id="author-bio"  class="author-bio"></p>
    </div>
  </section>

  <!-- ── Poemas ── -->
  <section id="poemas" aria-label="Poemas">
    <p class="section-title">— Muestra poética</p>
    <div id="poems-grid" class="poems-grid">
      <!-- Las tarjetas se inyectan desde main.js -->
    </div>
  </section>

  <!-- Ballena decorativa (SVG inline) -->
  <div class="whale-section" aria-hidden="true">
    <svg width="220" height="90" viewBox="0 0 220 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Cuerpo ballena -->
      <ellipse cx="100" cy="48" rx="80" ry="32" fill="url(#whale-body)"/>
      <!-- Cola -->
      <path d="M178 48 Q195 28 210 18 Q198 48 210 78 Q195 68 178 48Z" fill="url(#whale-tail)"/>
      <!-- Panza -->
      <ellipse cx="85" cy="58" rx="55" ry="15" fill="#a5f3fc" opacity=".15"/>
      <!-- Aleta pectoral -->
      <path d="M80 72 Q60 90 40 82 Q60 70 80 72Z" fill="#0e7490" opacity=".7"/>
      <!-- Ojo -->
      <circle cx="30" cy="44" r="6" fill="#04111f"/>
      <circle cx="32" cy="42" r="2" fill="#a5f3fc" opacity=".8"/>
      <!-- Chorro -->
      <path d="M22 38 Q18 22 24 8 Q28 22 34 38" stroke="#a5f3fc" stroke-width="1.5" fill="none" opacity=".5"/>
      <defs>
        <linearGradient id="whale-body" x1="20" y1="20" x2="180" y2="80" gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stop-color="#0a4a6e"/>
          <stop offset="100%" stop-color="#062d47"/>
        </linearGradient>
        <linearGradient id="whale-tail" x1="178" y1="18" x2="210" y2="78" gradientUnits="userSpaceOnUse">
          <stop offset="0%"  stop-color="#0e7490" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#14b8a6" stop-opacity=".3"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- ── Footer ── -->
  <footer>
    <p>La P-cera &nbsp;·&nbsp; David Pichardo &nbsp;·&nbsp; <span id="year"></span></p>
    <p style="margin-top:.4rem; opacity:.6">Las palabras flotan.</p>
  </footer>

</div><!-- /#app -->

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
<script src="assets/js/main.js"></script>
</body>
</html>
