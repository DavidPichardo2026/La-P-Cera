<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La P-cera · David Pichardo</title>
  <meta name="description" content="Muestra poética de David Pichardo. Palabras como agua.">
  <meta property="og:title" content="La P-cera · David Pichardo">
  <meta property="og:description" content="Poesía de David Pichardo. Palabras como agua, como raíz, como marea.">
  <meta property="og:type" content="website">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ── Fondo animado ── -->
<div id="ocean-bg">
  <div class="layer layer-1"></div>
  <div class="layer layer-2"></div>
</div>

<div id="app">

  <!-- ── Header ── -->
  <header>
    <h1 class="site-title">La P-cera</h1>
    <p class="site-tagline">Muestra poética · David Pichardo</p>

    <!-- Koi SVG animado (fondo transparente) -->
    <div class="koi-wrapper" aria-hidden="true">
      <svg class="koi" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="kg1" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#f5e6d0"/>
            <stop offset="100%" stop-color="#d4b896"/>
          </radialGradient>
          <radialGradient id="kg2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e8624a"/>
            <stop offset="100%" stop-color="#c04428"/>
          </radialGradient>
        </defs>
        <!-- Cola abanico -->
        <path d="M158 40 Q182 18 200 8 Q190 40 200 72 Q182 62 158 40Z" fill="url(#kg2)" opacity=".8"/>
        <path d="M158 40 Q176 26 190 20 Q184 40 190 60 Q176 54 158 40Z" fill="#f0a060" opacity=".45"/>
        <!-- Cuerpo forma de pez real -->
        <path d="M22 40 Q30 18 80 20 Q130 18 158 40 Q130 62 80 60 Q30 62 22 40Z" fill="url(#kg1)"/>
        <!-- Mancha naranja grande dorsal -->
        <path d="M55 22 Q90 18 115 26 Q105 38 75 36 Q58 34 55 22Z" fill="url(#kg2)" opacity=".85"/>
        <!-- Mancha naranja ventral -->
        <path d="M80 54 Q110 52 130 44 Q128 56 105 60 Q85 62 80 54Z" fill="url(#kg2)" opacity=".7"/>
        <!-- Mancha negra -->
        <ellipse cx="60" cy="46" rx="14" ry="9" fill="#2a1a0a" opacity=".65"/>
        <!-- Aleta dorsal -->
        <path d="M75 20 Q92 6 112 18" fill="none" stroke="#c04428" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
        <path d="M75 20 Q92 10 112 18 Q100 20 88 21 Q80 21 75 20Z" fill="#e8624a" opacity=".5"/>
        <!-- Aleta pectoral -->
        <path d="M65 52 Q52 66 38 62 Q50 56 65 52Z" fill="#d4a070" opacity=".65"/>
        <!-- Brillo en el lomo -->
        <path d="M60 26 Q100 20 130 30" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity=".2"/>
        <!-- Ojo -->
        <circle cx="28" cy="40" r="5.5" fill="#1a1008"/>
        <circle cx="28" cy="40" r="3" fill="#3a2010"/>
        <circle cx="30" cy="38" r="1.4" fill="white" opacity=".85"/>
        <!-- Bigotes -->
        <line x1="23" y1="39" x2="8"  y2="33" stroke="#c8a060" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
        <line x1="23" y1="42" x2="8"  y2="48" stroke="#c8a060" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
      </svg>
    </div>

    <nav>
      <a href="#sobre-el-autor">El autor</a>
      <a href="#poemas">Poemas</a>
      <a href="#foto-poesia">Foto-Poesía</a>
    </nav>
  </header>

  <!-- ── Sobre el autor ── -->
  <section id="sobre-el-autor" aria-label="Sobre el autor">
    <div id="author-img" class="author-photo-placeholder">🌊</div>
    <div>
      <h2 id="author-name" class="author-name">David Pichardo</h2>
      <p  id="author-bio"  class="author-bio"></p>
    </div>
  </section>

  <!-- ── Poemas ── -->
  <section id="poemas" aria-label="Poemas">
    <p class="section-title">— Muestra poética</p>
    <div id="poems-grid" class="poems-grid">
      <!-- Las tarjetas se inyectan desde main.js -->
    </div>
  </section>

  <!-- ── Foto-Poesía ── -->
  <section id="foto-poesia" aria-label="Foto-Poesía">
    <p class="section-title">— Foto-Poesía</p>
    <div class="fotpoesia-grid">
      <div class="fotopoema">
        <img src="assets/mi-pupila.jpeg" alt="mi pupila no es tu pupila" loading="lazy">
      </div>
      <div class="fotopoema">
        <img src="assets/Tu-boca-es-mi-boca.jpeg" alt="tu boca es mi boca" loading="lazy">
      </div>
      <div class="fotopoema">
        <img src="assets/tus-lagrimas.jpeg" alt="tus lágrimas son mis lágrimas" loading="lazy">
      </div>
    </div>
  </section>

  <!-- Ballena decorativa (SVG inline) -->
  <div class="whale-section" aria-hidden="true">
    <svg width="220" height="90" viewBox="0 0 220 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Cuerpo ballena -->
      <ellipse cx="100" cy="48" rx="80" ry="32" fill="url(#whale-body)"/>
      <!-- Cola -->
      <path d="M178 48 Q195 28 210 18 Q198 48 210 78 Q195 68 178 48Z" fill="url(#whale-tail)"/>
      <!-- Panza -->
      <ellipse cx="85" cy="58" rx="55" ry="15" fill="#a5f3fc" opacity=".15"/>
      <!-- Aleta pectoral -->
      <path d="M80 72 Q60 90 40 82 Q60 70 80 72Z" fill="#0e7490" opacity=".7"/>
      <!-- Ojo -->
      <circle cx="30" cy="44" r="6" fill="#04111f"/>
      <circle cx="32" cy="42" r="2" fill="#a5f3fc" opacity=".8"/>
      <!-- Chorro -->
      <path d="M22 38 Q18 22 24 8 Q28 22 34 38" stroke="#a5f3fc" stroke-width="1.5" fill="none" opacity=".5"/>
      <defs>
        <linearGradient id="whale-body" x1="20" y1="20" x2="180" y2="80" gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stop-color="#0a4a6e"/>
          <stop offset="100%" stop-color="#062d47"/>
        </linearGradient>
        <linearGradient id="whale-tail" x1="178" y1="18" x2="210" y2="78" gradientUnits="userSpaceOnUse">
          <stop offset="0%"  stop-color="#0e7490" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#14b8a6" stop-opacity=".3"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- ── Footer ── -->
  <footer>
    <p>La P-cera &nbsp;·&nbsp; David Pichardo &nbsp;·&nbsp; <span id="year"></span></p>
    <p style="margin-top:.4rem; opacity:.6">Las palabras flotan.</p>
  </footer>

</div><!-- /#app -->

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
<script src="assets/js/main.js"></script>
</body>
</html>
