<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La P-cera · David Pichardo</title>
  <meta name="description" content="Muestra poética de David Pichardo. Palabras como agua.">
  <meta property="og:title" content="La P-cera · David Pichardo">
  <meta property="og:description" content="Poesía de David Pichardo. Palabras como agua, como raíz, como marea.">
  <meta property="og:type" content="website">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ── Fondo animado ── -->
<div id="ocean-bg">
  <div class="layer layer-1"></div>
  <div class="layer layer-2"></div>
</div>

<div id="app">

  <!-- ── Header ── -->
  <header>
    <h1 class="site-title">La P-cera</h1>
    <p class="site-tagline">Muestra poética · David Pichardo</p>

    <!-- Koi acuarela -->
    <div class="koi-wrapper" aria-hidden="true">
      <svg class="koi" viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="watercolor">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
            <feGaussianBlur stdDeviation="0.4"/>
          </filter>
          <linearGradient id="koiBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f5e8d5"/>
            <stop offset="100%" stop-color="#d7b58c"/>
          </linearGradient>
          <linearGradient id="koiOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff9a62"/>
            <stop offset="100%" stop-color="#d65a31"/>
          </linearGradient>
        </defs>
        <!-- cola -->
        <path d="M380 110 Q440 50 490 20 Q460 110 490 200 Q440 170 380 110Z" fill="url(#koiOrange)" opacity=".75" filter="url(#watercolor)"/>
        <!-- cuerpo -->
        <path d="M60 110 Q100 40 220 55 Q340 70 380 110 Q340 150 220 165 Q100 180 60 110Z" fill="url(#koiBody)" filter="url(#watercolor)"/>
        <!-- manchas -->
        <ellipse cx="190" cy="90" rx="70" ry="28" fill="url(#koiOrange)" opacity=".75" filter="url(#watercolor)"/>
        <ellipse cx="260" cy="135" rx="55" ry="20" fill="#2a1209" opacity=".35" filter="url(#watercolor)"/>
        <!-- aleta dorsal -->
        <path d="M210 70 Q250 20 290 60" stroke="#d65a31" stroke-width="5" stroke-linecap="round" opacity=".4" fill="none"/>
        <!-- ojo -->
        <circle cx="90" cy="110" r="7" fill="#1a1008"/>
        <circle cx="93" cy="107" r="2" fill="white" opacity=".8"/>
        <!-- bigotes -->
        <line x1="65" y1="107" x2="38" y2="98" stroke="#c8a060" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
        <line x1="65" y1="114" x2="38" y2="123" stroke="#c8a060" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
      </svg>
    </div>

    <nav>
      <a href="#sobre-el-autor">El autor</a>
      <a href="#poemas">Poemas</a>
      <a href="#foto-poesia">Foto-Poesía</a>
    </nav>
  </header>

  <!-- ── Sobre el autor ── -->
  <section id="sobre-el-autor" aria-label="Sobre el autor">
    <div id="author-img" class="author-photo-placeholder">🌊</div>
    <div>
      <h2 id="author-name" class="author-name">David Pichardo</h2>
      <p  id="author-bio"  class="author-bio"></p>
    </div>
  </section>

  <!-- ── Poemas ── -->
  <section id="poemas" aria-label="Poemas">
    <p class="section-title">— Muestra poética</p>
    <div id="poems-grid" class="poems-grid">
      <!-- Las tarjetas se inyectan desde main.js -->
    </div>
  </section>

  <!-- ── Foto-Poesía ── -->
  <section id="foto-poesia" aria-label="Foto-Poesía">
    <p class="section-title">— Foto-Poesía</p>
    <div class="fotpoesia-grid">
      <div class="fotopoema">
        <img src="assets/mi-pupila.jpeg" alt="mi pupila no es tu pupila" loading="lazy">
      </div>
      <div class="fotopoema">
        <img src="assets/Tu-boca-es-mi-boca.jpeg" alt="tu boca es mi boca" loading="lazy">
      </div>
      <div class="fotopoema">
        <img src="assets/tus-lagrimas.jpeg" alt="tus lágrimas son mis lágrimas" loading="lazy" onerror="this.src='assets/WhatsApp Image 2026-06-08 at 7.03.17 PM (2).jpeg'">
      </div>
    </div>
  </section>

  <!-- Ballena acuarela -->
  <div class="whale-section" aria-hidden="true">
    <svg class="whale-watercolor" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="whaleTexture">
          <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"/>
          <feGaussianBlur stdDeviation="0.5"/>
        </filter>
        <linearGradient id="whaleBody" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0f3d5a"/>
          <stop offset="100%" stop-color="#041b2d"/>
        </linearGradient>
      </defs>
      <!-- cola -->
      <path d="M560 130 Q630 70 690 30 Q660 130 690 230 Q630 190 560 130Z" fill="#0a4969" opacity=".7" filter="url(#whaleTexture)"/>
      <!-- cuerpo -->
      <path d="M90 130 Q170 40 380 55 Q520 70 560 130 Q520 190 380 205 Q170 220 90 130Z" fill="url(#whaleBody)" filter="url(#whaleTexture)"/>
      <!-- panza -->
      <ellipse cx="320" cy="165" rx="180" ry="38" fill="#a5f3fc" opacity=".08"/>
      <!-- aleta -->
      <path d="M290 180 Q240 240 180 220 Q240 180 290 180Z" fill="#0b567d" opacity=".6" filter="url(#whaleTexture)"/>
      <!-- ojo -->
      <circle cx="140" cy="120" r="7" fill="#021018"/>
      <circle cx="143" cy="117" r="2" fill="#c9f5ff" opacity=".8"/>
      <!-- brillo -->
      <path d="M180 90 Q340 55 480 95" stroke="white" stroke-width="5" opacity=".06" stroke-linecap="round" fill="none"/>
    </svg>
  </div>

  <!-- ── Footer ── -->
  <footer>
    <p>La P-cera &nbsp;·&nbsp; David Pichardo &nbsp;·&nbsp; <span id="year"></span></p>
    <p style="margin-top:.4rem; opacity:.6">Las palabras flotan.</p>
  </footer>

</div><!-- /#app -->

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
<script src="assets/js/main.js"></script>
</body>
</html>
